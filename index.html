<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dubai Property Sentiment Tracker</title><style>body{font:16px system-ui;background:#f4f3ef;color:#27313b;margin:0}.wrap{max-width:1100px;margin:auto;padding:38px 22px}h1{font-size:clamp(34px,5vw,60px);margin:8px 0}.muted{color:#69737a}.card{background:#fff;border:1px solid #dedfdc;border-radius:18px;padding:22px;margin:20px 0}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}button{background:#243d50;color:white;border:0;border-radius:8px;padding:12px 16px;cursor:pointer;font-weight:700}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.metric{background:#e9f0ef;padding:18px;border-radius:12px}.metric strong{display:block;font-size:32px}.item{border-top:1px solid #ddd;padding:18px 0}.tag{display:inline-block;padding:4px 10px;border-radius:20px;background:#e3e8eb}.Positive{background:#d7efe0}.Negative{background:#f5dad8}a{color:#155873}@media(max-width:700px){.metrics{grid-template-columns:1fr}}</style><div class="wrap"><small>AITACLAB / REAL ESTATE DEMO 06</small><h1>Dubai property sentiment tracker</h1><p class="muted">Inspect a small sample or upload licensed news and social data as CSV.</p><div class="card row"><input type="file" id="file" accept=".csv,text/csv"><button id="sample">Load sample</button><span class="muted">CSV columns: date,source,text,url</span></div><div class="metrics"><div class="metric">Positive<strong id="positive">0</strong></div><div class="metric">Neutral<strong id="neutral">0</strong></div><div class="metric">Negative<strong id="negative">0</strong></div></div><div class="card"><h2 id="dataset">Sample</h2><p class="muted">This small selected sample demonstrates the method. It does not measure the market.</p><div id="items"></div></div></div><script type="module">import{analyze,parseCsv}from'./analysis.mjs';const sample=[{date:'2026-04-09',source:'Dubai Land Department',text:'Dubai real estate transactions surge 31% to reach AED 252 billion in Q1 2026',url:'https://dubailand.gov.ae/en/news-media/dubai-s-real-estate-transactions-surge-31-to-reach-aed-252-billion-in-q1-2026'},{date:'2025-04-24',source:'Dubai Land Department',text:'Dubai Land Department strengthens transparency with AI-enabled real estate advertising governance',url:'https://dubailand.gov.ae/en/news-media/dubai-land-department-strengthens-transparency-with-ai-enabled-real-estate-advertising-governance'},{date:'2026-09-01',source:'Synthetic social example',text:'I am concerned about delays in a fictional property handover.',url:''},{date:'2026-09-02',source:'Synthetic social example',text:'Strong demand and an improved viewing experience in my fictional search.',url:''}];let data=sample;function render(){const counts={Positive:0,Neutral:0,Negative:0};items.replaceChildren();for(const r of data){const a=analyze(r.text);counts[a.label]++;const div=document.createElement('div'),meta=document.createElement('p'),body=document.createElement('p'),tag=document.createElement('span');div.className='item';meta.className='muted';meta.textContent=`${r.date} · ${r.source}`;body.textContent=r.text;tag.className='tag '+a.label;tag.textContent=`${a.label} (${a.score})`;div.append(meta,body,tag);if(r.url){const link=document.createElement('a');link.href=r.url;link.target='_blank';link.rel='noopener noreferrer';link.textContent=' Source ↗';div.append(link)}items.append(div)}positive.textContent=counts.Positive;neutral.textContent=counts.Neutral;negative.textContent=counts.Negative;dataset.textContent=`${data.length} items analyzed`}document.querySelector('#sample').onclick=()=>{data=sample;render()};document.querySelector('#file').onchange=async e=>{try{data=parseCsv(await e.target.files[0].text());render()}catch(error){alert(error.message)}};render();</script></html>
